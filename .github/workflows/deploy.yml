name: Deploy FIDELITIZ API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.D1_DATABASE_ID != '' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Configure D1
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          config = Path('wrangler.toml.example').read_text()
          Path('wrangler.toml').write_text(config.replace('REPLACE_WITH_D1_DATABASE_ID', os.environ['D1_DATABASE_ID']))
          PY
      - run: npm run migrate:remote
      - run: npm run deploy
